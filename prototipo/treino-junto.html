<title>Treino Junto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: uma coluna de celular centralizada, barra de navegação inferior, cartões só onde há objeto (treino, foto) */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#13201A; --muted:#5B6A63; --line:#D8E0DB;
  --accent:#1E7A58; --accent-soft:#DCEFE6; --hot:#D9482F; --hot-soft:#FBE3DE; --warn:#B7791F; --warn-soft:#F8EBD3;
  --photo-a:#1E7A58; --photo-b:#2E4B7A;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --ink:#E6EEE9; --muted:#93A39B; --line:#26322D;
  --accent:#4CC79A; --accent-soft:#173A2D; --hot:#FF7B63; --hot-soft:#3C1D17; --warn:#E3B05A; --warn-soft:#3A2D16;
  --photo-a:#1B5E46; --photo-b:#253B5F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --ink:#E6EEE9; --muted:#93A39B; --line:#26322D;
  --accent:#4CC79A; --accent-soft:#173A2D; --hot:#FF7B63; --hot-soft:#3C1D17; --warn:#E3B05A; --warn-soft:#3A2D16;
  --photo-a:#1B5E46; --photo-b:#253B5F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 96px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
section.block{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--surface);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabular{font-variant-numeric:tabular-nums}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:12px}
.day b{font-family:var(--display);font-size:16px}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.day.done{background:var(--accent-soft);border-color:transparent}.day.done .dot{background:var(--accent)}
.day.missed{background:var(--hot-soft);border-color:transparent}.day.missed .dot{background:var(--hot)}
.day.today{border:2px solid var(--ink)}
.day.rest .dot{background:transparent;border:1px dashed var(--muted)}
.day.sel{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Exercícios */
.ex{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:transparent}
.ex.ok .chk{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.ex.ok .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-main{flex:1;min-width:0}
.ex-name{font-weight:700}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;padding:4px 8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* Status pill */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--hot-soft);color:var(--hot)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}

/* Check-in */
.photo{aspect-ratio:4/5;max-width:100%;width:100%;border-radius:12px;object-fit:cover;display:block;background:linear-gradient(140deg,var(--photo-a),var(--photo-b));color:#fff;
  display:grid;place-items:center;font-family:var(--display);font-size:15px;text-align:center;padding:16px}
img.photo{display:block}
.checkin-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.react{display:flex;gap:6px;flex-wrap:wrap}
.react button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:13px}
.react button.on{background:var(--accent-soft);border-color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;background:var(--surface)}
.preview{max-height:260px;object-fit:cover;width:100%;border-radius:12px}

/* Mensagens */
.msg{background:var(--accent-soft);border-radius:14px 14px 14px 4px;padding:10px 12px;align-self:flex-start;max-width:85%}
.msg.me{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 4px 14px;align-self:flex-end}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px}

/* Stats */
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--display);font-size:24px;font-weight:800}
svg text{fill:var(--muted)}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:9;max-width:90vw}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--surface);transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:after{transform:translateX(18px)}
.code{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.08em}
.login-hero{padding-block:36px 10px;display:flex;flex-direction:column;gap:8px}
.login-hero h1{font-size:40px;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.demo-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="nav" hidden><div class="in" id="navin"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DAYS_FULL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const KEY='treino-junto-v1';
const iso=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x.toISOString().slice(0,10)};
const today=new Date();
const todayISO=iso(today);
function weekDates(){ // segunda a domingo da semana atual
  const d=new Date(today);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);
  return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x});
}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function seed(){
  const wk=weekDates();
  const A=[{id:uid(),name:'Agachamento livre',sets:4,reps:'12',load:'20 kg'},{id:uid(),name:'Leg press 45°',sets:4,reps:'12',load:'80 kg'},{id:uid(),name:'Cadeira extensora',sets:3,reps:'15',load:'25 kg'},{id:uid(),name:'Elevação pélvica',sets:4,reps:'12',load:'30 kg'}];
  const B=[{id:uid(),name:'Puxada frontal',sets:4,reps:'12',load:'30 kg'},{id:uid(),name:'Remada baixa',sets:3,reps:'12',load:'25 kg'},{id:uid(),name:'Desenvolvimento c/ halter',sets:3,reps:'10',load:'6 kg'},{id:uid(),name:'Tríceps corda',sets:3,reps:'15',load:'15 kg'}];
  const C=[{id:uid(),name:'Esteira inclinada',sets:1,reps:'30 min',load:'6 km/h'},{id:uid(),name:'Prancha',sets:3,reps:'40 s',load:'—'},{id:uid(),name:'Abdominal infra',sets:3,reps:'15',load:'—'}];
  const clone=a=>a.map(e=>({...e,id:uid()}));
  const plan={1:{title:'Treino A · Inferiores',ex:A},2:{title:'Treino B · Superiores',ex:B},3:{title:'Treino C · Cardio + abdômen',ex:C},4:{title:'Treino A · Inferiores',ex:clone(A)},5:{title:'Treino B · Superiores',ex:clone(B)},6:null,0:null};
  const log={};
  const checkins=[];
  // dias anteriores da semana: alterna feito / faltou como exemplo
  wk.forEach((d,i)=>{
    const k=iso(d); if(k>=todayISO) return; const p=plan[d.getDay()]; if(!p) return;
    if(i%2===0){ log[k]={done:p.ex.map(e=>e.id)}; checkins.push({id:uid(),date:k,time:'18:4'+i,photo:null,caption:i===0?'Primeiro treino da semana!':'Feito ✔',reactions:{'💪':true}}); }
  });
  // semanas anteriores para histórico
  for(let w=1;w<=3;w++){for(let j=1;j<=5;j++){const d=new Date(wk[0]);d.setDate(d.getDate()-7*w+(j-1));if((w+j)%4!==0){log[iso(d)]={done:['x']};checkins.push({id:uid(),date:iso(d),time:'19:10',photo:null,caption:'',reactions:{}})}}}
  const weights=[];const base=new Date(today);
  [78.4,77.9,77.6,77.1,76.8,76.2,75.9,75.4].forEach((kg,i,arr)=>{const d=new Date(base);d.setDate(d.getDate()-7*(arr.length-1-i));weights.push({date:iso(d),kg})});
  return {
    session:null,
    users:{
      atleta:{id:'atleta',name:'Camila',email:'camila@exemplo.com',code:'FIT-4829',goal:70},
      parceiro:{id:'parceiro',name:'Você',email:'voce@exemplo.com',code:'FIT-1173'}
    },
    links:[{athlete:'atleta',viewer:'parceiro',perm:{treinos:true,checkins:true,peso:false}}],
    plan,log,checkins:checkins.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),weights,
    messages:[{from:'parceiro',text:'Bora que hoje é dia de treino! 💪',at:todayISO+' 08:12'}]
  };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.users) S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let view='login', tab=null, selDay=today.getDay(), pendingPhoto=null, loginMode='entrar';
const $=s=>document.querySelector(s);
const app=$('#app');
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}

function dayStatus(d){
  const k=iso(d),p=S.plan[d.getDay()],l=S.log[k];
  const done=l&&p&&l.done.length>=p.ex.length || (l&&l.done[0]==='x');
  const checked=S.checkins.some(c=>c.date===k);
  if(!p) return checked?'done':'rest';
  if(done||checked) return 'done';
  if(k<todayISO) return 'missed';
  return k===todayISO?'today':'future';
}
function streak(){ // dias de treino planejados seguidos cumpridos
  let n=0;const d=new Date(today);
  if(dayStatus(d)!=='done') d.setDate(d.getDate()-1);
  for(let i=0;i<60;i++){const s=dayStatus(d);if(s==='done')n++;else if(s==='missed')break;d.setDate(d.getDate()-1)}
  return n;
}
function weekCount(){const wk=weekDates();const planned=wk.filter(d=>S.plan[d.getDay()]).length;const done=wk.filter(d=>dayStatus(d)==='done').length;return{done,planned}}

const ICON={
  hoje:'<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>',
  semana:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  checkin:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  progresso:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  perfil:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  acompanhar:'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  mensagens:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>'
};
function setNav(items){
  const nav=$('#nav');nav.hidden=!items;if(!items)return;
  $('#navin').innerHTML=items.map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${ICON[k]}${l}</button>`).join('');
}
const me=()=>S.users[S.session];
const athlete=()=>S.users.atleta;
const link=()=>S.links[0];

/* ---------- LOGIN ---------- */
function renderLogin(){
  setNav(null);
  app.innerHTML=`
  <div class="login-hero"><span class="label">Protótipo</span><h1>Treino Junto</h1>
  <p class="muted">Ela registra os treinos e faz check-in com foto. Você acompanha e manda força.</p></div>
  <div class="seg" role="tablist"><button data-mode="entrar" class="${loginMode==='entrar'?'on':''}">Entrar</button><button data-mode="criar" class="${loginMode==='criar'?'on':''}">Criar conta</button></div>
  <form class="stack" id="loginForm" style="margin-top:14px">
    ${loginMode==='criar'?`<div class="field"><label class="label" for="lname">Nome</label><input id="lname" placeholder="Seu nome"></div>
    <div class="field"><label class="label" for="lrole">Como você vai usar</label><select id="lrole"><option>Vou treinar e registrar</option><option>Vou acompanhar alguém</option><option>Os dois</option></select></div>`:''}
    <div class="field"><label class="label" for="lemail">E-mail</label><input id="lemail" type="email" placeholder="nome@email.com"></div>
    <div class="field"><label class="label" for="lpass">Senha</label><input id="lpass" type="password" placeholder="••••••••"></div>
    <button class="btn" type="submit">${loginMode==='entrar'?'Entrar':'Criar conta'}</button>
  </form>
  <div class="stack" style="margin-top:20px">
    <p class="demo-note">No protótipo não há servidor. Escolha uma das contas de exemplo para ver cada lado do app:</p>
    <button class="btn ghost" data-demo="atleta">Entrar como Camila (quem treina)</button>
    <button class="btn ghost" data-demo="parceiro">Entrar como você (quem acompanha)</button>
  </div>`;
}

/* ---------- ATLETA ---------- */
function renderAthlete(){
  setNav([['hoje','Hoje'],['semana','Semana'],['checkin','Check-in'],['progresso','Progresso'],['perfil','Perfil']]);
  const u=me();
  const head=`<div class="top"><div><span class="label">${DAYS_FULL[today.getDay()]}, ${today.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span><h1>Oi, ${esc(u.name)}</h1></div><button class="chip" data-act="logout">Trocar conta</button></div>`;
  if(tab==='hoje') app.innerHTML=head+athleteToday();
  if(tab==='semana') app.innerHTML=head+athleteWeek();
  if(tab==='checkin') app.innerHTML=head+athleteCheckin();
  if(tab==='progresso') app.innerHTML=head+progressView(true);
  if(tab==='perfil') app.innerHTML=head+athleteProfile();
}
function workoutCard(dayNum,dateISO,editable){
  const p=S.plan[dayNum];
  if(!p) return `<div class="card"><h3>Dia de descanso</h3><p class="muted small">Nenhum treino planejado. Descansar também faz parte.</p></div>`;
  const l=S.log[dateISO]||{done:[]};
  const pct=Math.round(100*p.ex.filter(e=>l.done.includes(e.id)).length/Math.max(1,p.ex.length));
  return `<div class="card stack"><div class="row between"><h2>${esc(p.title)}</h2><span class="small muted tabular">${pct}%</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div>${p.ex.map(e=>`<div class="ex ${l.done.includes(e.id)?'ok':''}">
     ${editable?`<button class="chk" data-toggle="${e.id}" aria-label="Marcar ${esc(e.name)}">${l.done.includes(e.id)?'✓':''}</button>`:`<span class="chk">${l.done.includes(e.id)?'✓':''}</span>`}
     <div class="ex-main"><div class="ex-name">${esc(e.name)}</div><div class="small muted tabular">${e.sets} × ${esc(e.reps)} · ${esc(e.load)}</div></div></div>`).join('')}</div></div>`;
}
function athleteToday(){
  const checked=S.checkins.find(c=>c.date===todayISO);
  const msgs=S.messages.filter(m=>m.from!==S.session).slice(-2);
  const wc=weekCount();
  return `
  <section class="block">
    <div class="grid3">
      <div class="stat"><span class="label">Sequência</span><b class="tabular">${streak()}</b><span class="small muted">treinos seguidos</span></div>
      <div class="stat"><span class="label">Semana</span><b class="tabular">${wc.done}/${wc.planned}</b><span class="small muted">treinos feitos</span></div>
      <div class="stat"><span class="label">Peso</span><b class="tabular">${S.weights.at(-1).kg.toFixed(1)}</b><span class="small muted">kg</span></div>
    </div>
  </section>
  ${msgs.length?`<section class="block"><span class="label">Recado de quem te acompanha</span>${msgs.map(m=>`<div class="msg">${esc(m.text)}<div class="small muted">${esc(m.at.slice(11))}</div></div>`).join('')}</section>`:''}
  <section class="block">
    <div class="row between"><span class="label">Treino de hoje</span>${checked?'<span class="pill ok">Check-in feito</span>':'<span class="pill wait">Sem check-in</span>'}</div>
    ${checked?'':`<button class="btn" data-tab="checkin">Cheguei na academia · fazer check-in</button>`}
    ${workoutCard(today.getDay(),todayISO,true)}
  </section>`;
}
function athleteWeek(){
  const wk=weekDates();
  const d=wk.find(x=>x.getDay()===selDay)||wk[0];
  const p=S.plan[selDay];
  return `<section class="block"><span class="label">Esta semana</span>
  <div class="week">${wk.map(x=>`<button class="day ${dayStatus(x)} ${x.getDay()===selDay?'sel':''} ${iso(x)===todayISO?'today':''}" data-day="${x.getDay()}"><span>${DAYS[x.getDay()]}</span><b class="tabular">${x.getDate()}</b><span class="dot"></span></button>`).join('')}</div>
  ${legend()}</section>
  <section class="block"><div class="row between"><h2>${DAYS_FULL[selDay]}</h2>
    ${p?`<button class="btn sm ghost" data-act="rest">Marcar como descanso</button>`:''}</div>
    <div class="field"><label class="label" for="wtitle">Nome do treino</label><input id="wtitle" value="${esc(p?.title||'')}" placeholder="Ex.: Treino A · Inferiores"></div>
    ${p?`<div class="card">${p.ex.map(e=>`<div class="ex"><div class="ex-main"><div class="ex-name">${esc(e.name)}</div><div class="small muted tabular">${e.sets} × ${esc(e.reps)} · ${esc(e.load)}</div></div><button class="del" data-delex="${e.id}" aria-label="Remover ${esc(e.name)}">×</button></div>`).join('')||'<p class="muted small">Nenhum exercício ainda.</p>'}</div>`:'<p class="muted small">Dia de descanso. Adicione um exercício para transformar em dia de treino.</p>'}
  </section>
  <section class="block"><span class="label">Adicionar exercício em ${DAYS_FULL[selDay].toLowerCase()}</span>
    <form id="exForm" class="stack">
      <div class="field"><label class="label" for="exname">Exercício</label><input id="exname" list="exlist" placeholder="Ex.: Supino reto" required>
      <datalist id="exlist"><option>Agachamento livre</option><option>Leg press 45°</option><option>Stiff</option><option>Cadeira flexora</option><option>Supino reto</option><option>Puxada frontal</option><option>Rosca direta</option><option>Bicicleta</option><option>Esteira</option></datalist></div>
      <div class="grid3">
        <div class="field"><label class="label" for="exsets">Séries</label><input id="exsets" type="number" min="1" value="3"></div>
        <div class="field"><label class="label" for="exreps">Reps</label><input id="exreps" value="12"></div>
        <div class="field"><label class="label" for="exload">Carga</label><input id="exload" placeholder="kg"></div>
      </div>
      <button class="btn" type="submit">Adicionar</button>
    </form></section>`;
}
function legend(){return `<div class="legend"><span><i style="background:var(--accent)"></i>Treinou</span><span><i style="background:var(--hot)"></i>Faltou</span><span><i style="background:var(--line)"></i>Planejado</span><span><i style="border:1px dashed var(--muted)"></i>Descanso</span></div>`}
function checkinCard(c,canReact){
  const d=new Date(c.date+'T12:00');
  const r=c.reactions||{};
  return `<div class="card stack"><div class="checkin-head"><h3>${DAYS_FULL[d.getDay()]} · ${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</h3><span class="small muted tabular">${esc(c.time)}</span></div>
  ${c.photo?`<img class="photo" src="${c.photo}" alt="Foto do check-in">`:`<div class="photo">Foto de exemplo<br>(no app real, a selfie da academia aparece aqui)</div>`}
  ${c.caption?`<p style="margin:0">${esc(c.caption)}</p>`:''}
  <div class="react">${['💪','🔥','❤️','👏'].map(e=>canReact?`<button class="${r[e]?'on':''}" data-react="${c.id}" data-emoji="${e}">${e}</button>`:(r[e]?`<span class="pill ok">${e} de quem acompanha</span>`:'')).join('')}</div></div>`;
}
function athleteCheckin(){
  const checked=S.checkins.find(c=>c.date===todayISO);
  return `<section class="block"><span class="label">Check-in de hoje</span>
  ${checked?`<p class="muted small">Você já fez check-in hoje. Pode mandar outra foto se quiser.</p>`:''}
  <label class="drop" for="photoIn">${pendingPhoto?`<img class="preview" src="${pendingPhoto}" alt="Prévia da foto">`:`<b>Tirar ou escolher foto</b><span class="small muted">Uma selfie no espelho da academia já vale</span>`}</label>
  <input id="photoIn" type="file" accept="image/*" capture="user" hidden>
  <div class="field"><label class="label" for="caption">Legenda</label><input id="caption" placeholder="Ex.: Hoje é dia de perna!"></div>
  <button class="btn" data-act="sendcheckin">Enviar check-in</button>
  <p class="small muted">No app real, a hora e a localização da academia ficam registradas junto da foto.</p></section>
  <section class="block"><span class="label">Seus check-ins</span>${S.checkins.filter(c=>c.date>=iso(weekDates()[0])).map(c=>checkinCard(c,false)).join('')||'<p class="muted">Nenhum check-in nesta semana.</p>'}</section>`;
}
function progressView(own){
  const w=S.weights;const goal=athlete().goal;
  const min=Math.min(goal,...w.map(x=>x.kg))-1,max=Math.max(...w.map(x=>x.kg))+1;
  const W=320,H=150,pad=30;
  const x=i=>pad+i*(W-pad-10)/(w.length-1), y=v=>10+(max-v)*(H-30)/(max-min);
  const pts=w.map((p,i)=>`${x(i)},${y(p.kg)}`).join(' ');
  const lost=(w[0].kg-w.at(-1).kg).toFixed(1);
  const ticks=[Math.ceil(min),Math.round((min+max)/2),Math.floor(max)];
  // últimas 4 semanas de frequência
  const wk0=weekDates()[0];
  const weeks=[3,2,1,0].map(n=>{let done=0,planned=0;for(let i=0;i<7;i++){const d=new Date(wk0);d.setDate(d.getDate()-7*n+i);if(iso(d)>todayISO)continue;if(S.plan[d.getDay()])planned++;if(dayStatus(d)==='done')done++}return{n,done,planned}});
  return `<section class="block"><span class="label">Peso</span>
  <div class="grid3"><div class="stat"><span class="label">Atual</span><b class="tabular">${w.at(-1).kg.toFixed(1)}</b><span class="small muted">kg</span></div>
  <div class="stat"><span class="label">Perdeu</span><b class="tabular">${lost}</b><span class="small muted">kg em ${w.length-1} sem.</span></div>
  <div class="stat"><span class="label">Meta</span><b class="tabular">${goal}</b><span class="small muted">kg</span></div></div>
  <div class="card" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de peso">
    ${ticks.map(t=>`<line x1="${pad}" x2="${W-10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pad-6}" y="${y(t)+4}" font-size="10" text-anchor="end">${t}</text>`).join('')}
    <line x1="${pad}" x2="${W-10}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="${W-10}" y="${y(goal)-5}" font-size="10" text-anchor="end">meta</text>
    <polygon points="${x(0)},${H-20} ${pts} ${x(w.length-1)},${H-20}" fill="var(--accent-soft)" opacity=".7"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(w.length-1)}" cy="${y(w.at(-1).kg)}" r="4.5" fill="var(--accent)"/>
    ${w.map((p,i)=>i%2===w.length%2?`<text x="${x(i)}" y="${H-5}" font-size="10" text-anchor="middle">${p.date.slice(8)}/${p.date.slice(5,7)}</text>`:'').join('')}
  </svg></div>
  ${own?`<form id="wForm" class="row"><div class="field" style="flex:1"><label class="label" for="wkg">Registrar peso de hoje (kg)</label><input id="wkg" type="number" step="0.1" placeholder="${w.at(-1).kg}"></div><button class="btn sm" type="submit" style="align-self:flex-end;padding:11px 14px">Salvar</button></form>`:''}
  </section>
  <section class="block"><span class="label">Frequência nas últimas 4 semanas</span>
  <div class="card stack">${weeks.map(o=>`<div class="row"><span class="small" style="width:90px">${o.n===0?'Esta semana':o.n===1?'Semana passada':`Há ${o.n} semanas`}</span><div class="bar" style="flex:1"><i style="width:${o.planned?100*o.done/o.planned:0}%"></i></div><span class="small tabular" style="width:34px;text-align:right">${o.done}/${o.planned}</span></div>`).join('')}</div></section>`;
}
function athleteProfile(){
  const l=link();
  return `<section class="block"><span class="label">Seu código de conexão</span>
  <div class="card stack"><div class="code">${athlete().code}</div><p class="small muted" style="margin:0">Passe esse código para quem vai te acompanhar (namorado, amiga, personal). A pessoa digita na conta dela e vocês ficam conectados.</p>
  <button class="btn sm ghost" data-act="copy">Copiar código</button></div></section>
  <section class="block"><span class="label">Quem te acompanha</span>
  <div class="card stack"><div class="row between"><div><h3>${esc(S.users.parceiro.name)}</h3><span class="small muted">Conectado</span></div><span class="pill ok">Ativo</span></div>
  ${[['treinos','Ver meus treinos'],['checkins','Ver meus check-ins e fotos'],['peso','Ver meu peso']].map(([k,t])=>`<label class="row between" for="perm-${k}"><span>${t}</span><span class="switch"><input type="checkbox" id="perm-${k}" data-perm="${k}" ${l.perm[k]?'checked':''}><span></span></span></label>`).join('')}
  </div></section>
  <section class="block"><button class="btn ghost" data-act="reset">Restaurar dados de exemplo</button></section>`;
}

/* ---------- PARCEIRO ---------- */
function renderPartner(){
  setNav([['acompanhar','Acompanhar'],['mensagens','Mensagens'],['progresso','Progresso'],['perfil','Perfil']]);
  const a=athlete();
  const head=`<div class="top"><div><span class="label">Acompanhando</span><h1>${esc(a.name)}</h1></div><button class="chip" data-act="logout">Trocar conta</button></div>`;
  const l=link();
  if(tab==='acompanhar') app.innerHTML=head+partnerFollow();
  if(tab==='mensagens') app.innerHTML=head+partnerMsgs();
  if(tab==='progresso') app.innerHTML=head+(l.perm.peso?progressView(false):`<section class="block"><div class="card stack"><h3>Peso privado</h3><p class="muted small" style="margin:0">${esc(a.name)} escolheu não compartilhar o peso. Você ainda vê a frequência abaixo.</p></div></section>`+freqOnly());
  if(tab==='perfil') app.innerHTML=head+partnerProfile();
}
function freqOnly(){const html=progressView(false);return html.slice(html.lastIndexOf('<section'))}
function partnerFollow(){
  const a=athlete();const wk=weekDates();const wc=weekCount();
  const st=dayStatus(today);const ci=S.checkins.find(c=>c.date===todayISO);
  const hasPlan=!!S.plan[today.getDay()];
  const statusPill=ci?`<span class="pill ok">Fez check-in às ${esc(ci.time)}</span>`:hasPlan?`<span class="pill wait">Ainda não fez check-in</span>`:`<span class="pill ok">Dia de descanso</span>`;
  const last=S.checkins[0];
  return `<section class="block">
    <div class="card stack"><div class="row between"><h2>Hoje</h2>${statusPill}</div>
    ${!ci&&hasPlan?`<p class="small muted" style="margin:0">Treino planejado: <b>${esc(S.plan[today.getDay()].title)}</b>. Que tal mandar um incentivo?</p>
    <div class="quick">${['Bora treinar! 💪','Tô orgulhoso de você','Só 1 hora e tá feito','Depois a gente comemora 🍓'].map(t=>`<button data-quick="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}
    </div></section>
  <section class="block"><div class="row between"><span class="label">Semana</span><span class="small muted tabular">${wc.done} de ${wc.planned} treinos</span></div>
    <div class="week">${wk.map(x=>`<div class="day ${dayStatus(x)} ${iso(x)===todayISO?'today':''}"><span>${DAYS[x.getDay()]}</span><b class="tabular">${x.getDate()}</b><span class="dot"></span></div>`).join('')}</div>
    ${legend()}
    <div class="grid3"><div class="stat"><span class="label">Sequência</span><b class="tabular">${streak()}</b><span class="small muted">seguidos</span></div>
    <div class="stat"><span class="label">Faltas</span><b class="tabular">${wk.filter(x=>dayStatus(x)==='missed').length}</b><span class="small muted">nesta semana</span></div>
    <div class="stat"><span class="label">Check-ins</span><b class="tabular">${S.checkins.filter(c=>c.date>=iso(wk[0])).length}</b><span class="small muted">nesta semana</span></div></div>
  </section>
  ${link().perm.checkins&&last?`<section class="block"><span class="label">Último check-in</span>${checkinCard(last,true)}</section>`:''}
  ${link().perm.treinos?`<section class="block"><span class="label">Treino de hoje de ${esc(a.name)}</span>${workoutCard(today.getDay(),todayISO,false)}</section>`:''}`;
}
function partnerMsgs(){
  return `<section class="block"><span class="label">Conversa com ${esc(athlete().name)}</span>
  <div class="stack">${S.messages.map(m=>`<div class="msg ${m.from===S.session?'me':''}">${esc(m.text)}<div class="small muted">${esc(m.at.slice(11))}</div></div>`).join('')}</div>
  <div class="quick">${['Bora treinar! 💪','Arrasou hoje!','Não desiste não','Te busco depois do treino'].map(t=>`<button data-quick="${esc(t)}">${esc(t)}</button>`).join('')}</div>
  <form id="msgForm" class="row"><input id="msgIn" class="field" style="flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px" placeholder="Escreva um recado"><button class="btn sm" type="submit" style="padding:11px 14px">Enviar</button></form></section>`;
}
function partnerProfile(){
  return `<section class="block"><span class="label">Pessoas que você acompanha</span>
  <div class="card row between"><div><h3>${esc(athlete().name)}</h3><span class="small muted">Código ${athlete().code}</span></div><span class="pill ok">Conectada</span></div></section>
  <section class="block"><span class="label">Conectar outra pessoa</span>
  <form id="connForm" class="row"><input id="connIn" style="flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px" placeholder="Código, ex.: FIT-0000"><button class="btn sm" type="submit" style="padding:11px 14px">Conectar</button></form>
  <p class="small muted">A pessoa precisa aceitar o pedido e escolher o que você pode ver.</p></section>
  <section class="block"><span class="label">Lembretes</span>
  <div class="card stack">
   <label class="row between" for="n1"><span>Me avisar se ela não fizer check-in até às 19h</span><span class="switch"><input type="checkbox" id="n1" checked><span></span></span></label>
   <label class="row between" for="n2"><span>Me avisar quando ela fizer check-in</span><span class="switch"><input type="checkbox" id="n2" checked><span></span></span></label>
  </div></section>`;
}

/* ---------- RENDER + EVENTOS ---------- */
function render(){
  if(!S.session){view='login';renderLogin();return}
  if(S.session==='atleta'){tab=tab&&['hoje','semana','checkin','progresso','perfil'].includes(tab)?tab:'hoje';renderAthlete()}
  else {tab=tab&&['acompanhar','mensagens','progresso','perfil'].includes(tab)?tab:'acompanhar';renderPartner()}
  window.scrollTo(0,0);
}
function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-day]');if(!t)return;
  if(t.dataset.mode){loginMode=t.dataset.mode;render();return}
  if(t.dataset.demo){S.session=t.dataset.demo;tab=null;save();render();toast(`Entrou como ${S.users[t.dataset.demo].name}`);return}
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.day){selDay=+t.dataset.day;render();return}
  if(t.dataset.toggle){const l=S.log[todayISO]||(S.log[todayISO]={done:[]});const i=l.done.indexOf(t.dataset.toggle);i>=0?l.done.splice(i,1):l.done.push(t.dataset.toggle);save();render();
    const p=S.plan[today.getDay()];if(p&&l.done.length===p.ex.length)toast('Treino completo! Arrasou');return}
  if(t.dataset.delex){const p=S.plan[selDay];p.ex=p.ex.filter(x=>x.id!==t.dataset.delex);save();render();return}
  if(t.dataset.react){const c=S.checkins.find(x=>x.id===t.dataset.react);c.reactions=c.reactions||{};c.reactions[t.dataset.emoji]=!c.reactions[t.dataset.emoji];save();render();return}
  if(t.dataset.quick){S.messages.push({from:S.session,text:t.dataset.quick,at:todayISO+' '+nowHM()});save();render();toast('Recado enviado');return}
  const act=t.dataset.act;
  if(act==='logout'){S.session=null;save();render()}
  if(act==='rest'){S.plan[selDay]=null;save();render()}
  if(act==='sendcheckin'){
    S.checkins.unshift({id:uid(),date:todayISO,time:nowHM(),photo:pendingPhoto,caption:$('#caption').value.trim(),reactions:{}});
    pendingPhoto=null;save();tab='hoje';render();toast('Check-in enviado. Quem te acompanha vai ver!')}
  if(act==='copy'){const c=athlete().code;navigator.clipboard?.writeText(c).then(()=>toast('Código copiado'),()=>toast('Código: '+c))}
  if(act==='reset'){S=seed();S.session='atleta';save();render();toast('Dados de exemplo restaurados')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='photoIn'&&t.files[0]){
    // reduz a foto para caber no armazenamento local
    const img=new Image();const url=URL.createObjectURL(t.files[0]);
    img.onload=()=>{const s=Math.min(1,720/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingPhoto=c.toDataURL('image/jpeg',.75);URL.revokeObjectURL(url);const cap=$('#caption')?.value;render();if(cap)$('#caption').value=cap};
    img.src=url;
  }
  if(t.dataset.perm){link().perm[t.dataset.perm]=t.checked;save();toast(t.checked?'Compartilhamento ativado':'Compartilhamento desativado')}
  if(t.id==='wtitle'&&t.value.trim()){if(!S.plan[selDay])S.plan[selDay]={title:'',ex:[]};S.plan[selDay].title=t.value.trim();save();render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='loginForm'){S.session=loginMode==='criar'&&$('#lrole').selectedIndex===1?'parceiro':'atleta';tab=null;save();render();toast('Protótipo: entrou com a conta de exemplo')}
  if(f.id==='exForm'){
    if(!S.plan[selDay])S.plan[selDay]={title:$('#wtitle').value.trim()||'Treino',ex:[]};
    S.plan[selDay].ex.push({id:uid(),name:$('#exname').value.trim(),sets:+$('#exsets').value||1,reps:$('#exreps').value||'—',load:$('#exload').value||'—'});
    save();render();toast('Exercício adicionado')}
  if(f.id==='wForm'){const v=parseFloat($('#wkg').value);if(!v){toast('Digite o peso em kg, ex.: 75.2');return}
    const ex=S.weights.find(w=>w.date===todayISO);ex?ex.kg=v:S.weights.push({date:todayISO,kg:v});save();render();toast('Peso registrado')}
  if(f.id==='msgForm'){const v=$('#msgIn').value.trim();if(!v)return;S.messages.push({from:S.session,text:v,at:todayISO+' '+nowHM()});save();render();toast('Recado enviado')}
  if(f.id==='connForm'){toast('Pedido enviado. Aguardando a pessoa aceitar.');f.reset()}
});
render();
})();
</script>
